[project]
name = "clasificador-comida"
version = "2.0.0"
description = "Clasificador de sabores en fotos de comida (platillo -> sabores) con CLIP y comida mexicana"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "gradio>=5",
    "numpy>=2",
    "pandas>=2.2",
    "pillow<13",
    "scikit-learn>=1.5",
    "joblib",
    "open-clip-torch>=2.29",
    "icrawler>=0.6.9",
    "tqdm",
    "transformers>=4.45",
]

# torch se elige con un "extra": cpu (cualquier PC) o gpu (tarjeta NVIDIA, CUDA 12.6).
# INICIAR.bat detecta la tarjeta solo. Manual: uv run --extra cpu python app.py
[project.optional-dependencies]
cpu = ["torch>=2.5", "torchvision>=0.20"]
gpu = ["torch>=2.5", "torchvision>=0.20"]

[tool.uv]
package = false
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "gpu", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu126", extra = "gpu", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
